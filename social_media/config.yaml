# Social Media Configuration for Aggressive Growth
# Refiloe Marketing Platform

# Posting Schedule Configuration
posting_schedule:
  # All weeks: 1 quality post per day
  week_1:
    enabled: true
    posts_per_day: 1
    times: ["12:00"]
    timezone: "SAST"
    description: "Launch phase - 1 quality post daily at noon"

  week_2_to_4:
    enabled: true
    posts_per_day: 1
    times: ["12:00"]
    timezone: "SAST"
    description: "Growth phase - consistent daily posting"

  week_5_plus:
    enabled: true
    posts_per_day: 1
    times: ["12:00"]
    timezone: "SAST"
    description: "Sustained phase - quality over quantity"

# Stories Configuration
stories:
  enabled: true
  posts_per_day: 2
  types: ["behind_the_scenes", "quick_tips", "polls"]
  duration: 15  # seconds

# Reels Configuration
reels:
  enabled: true
  posts_per_day: 1
  max_duration: 60
  trending_sounds: true

# Content Hooks
content_hooks:
  pain_points:
    - "Struggling to attract consistent clients?"
    - "Tired of clients ghosting after one session?"
    - "Spending hours on admin instead of training?"
    - "Can't scale beyond 1-on-1 sessions?"
    - "Low engagement on your fitness posts?"
    - "Pricing too low and feeling undervalued?"
    - "No system for tracking client progress?"
    - "Difficult to stand out in a saturated market?"
    - "Wasting money on ads that don't convert?"
    - "Not sure how to package your services?"
    - "Clients not seeing results and blaming you?"
    - "Feeling burnt out from irregular income?"
    - "Struggling to get testimonials from clients?"
    - "Don't know how to leverage social media effectively?"
    - "No clear brand identity or positioning?"
    - "Missing out on corporate wellness opportunities?"
    - "Can't justify raising your rates?"
    - "Losing clients to cheaper online programs?"
    - "No strategy for client retention?"
    - "Spending too much time creating content?"

  success_stories:
    - "How I went from 5 to 50 clients in 3 months"
    - "The simple system that doubled my client retention"
    - "From R300 to R1200 per session - my pricing journey"
    - "How I filled my calendar using Instagram alone"
    - "The content strategy that brought me 20+ leads per week"
    - "Why I stopped doing free consultations (and what happened)"
    - "How I automated 80% of my admin work"
    - "The mindset shift that transformed my training business"
    - "From side hustle to R50k/month in 6 months"
    - "How one viral reel changed my entire business"

  engagement_questions:
    - "What's your biggest challenge as a fitness professional right now?"
    - "Drop a 💪 if you're ready to level up your training business"
    - "Morning or evening training sessions - which converts better for you?"
    - "What would you do with 10 extra clients this month?"
    - "Comment 'GROWTH' if you want my free client attraction checklist"
    - "Poll: What's holding you back? A) Time B) Money C) Knowledge D) Fear"
    - "Tag a trainer who needs to see this"
    - "What's one business goal you're crushing this month?"
    - "Real talk: What's your current monthly revenue target?"
    - "If you could change ONE thing about your training business, what would it be?"

# Hashtag Strategy
hashtag_strategy:
  primary:
    - "#PersonalTrainer"
    - "#FitnessCoach"
    - "#PTBusiness"
    - "#FitnessEntrepreneur"
    - "#TrainerLife"

  niche:
    - "#OnlinePersonalTraining"
    - "#FitnessBusinessCoach"
    - "#PersonalTrainerMarketing"
    - "#PTSuccess"
    - "#FitPro"
    - "#TrainerTips"
    - "#GymBusinessGrowth"
    - "#FitnessIndustry"
    - "#PTMarketing"
    - "#TrainerCommunity"
    - "#FitnessProfessional"
    - "#CertifiedPersonalTrainer"
    - "#OnlineCoaching"
    - "#FitnessBusinessTips"
    - "#PTLifestyle"

  regional:
    south_africa:
      - "#SAFitness"
      - "#SouthAfricanTrainer"
      - "#PTSouthAfrica"
      - "#JohannesburgFitness"
      - "#CapeTownPT"
      - "#DurbanTrainer"
      - "#PretoriaFitness"
      - "#SAFitPro"

    africa:
      - "#AfricanFitness"
      - "#AfricaFitPro"
      - "#FitnessAfrica"

    international:
      - "#GlobalFitness"
      - "#WorldwidePT"
      - "#InternationalCoach"

  trending:
    enabled: true
    refresh_daily: true
    slot_count: 3
    research_tools:
      - "Instagram Explore"
      - "TikTok Discover"
      - "Google Trends"

  max_per_post: 25
  rotation_strategy: "mix_all_categories"

# Content Pillars
content_pillars:
  education: 30%  # Training tips, business advice
  inspiration: 25%  # Success stories, motivation
  entertainment: 20%  # Behind the scenes, day in life
  promotion: 15%  # Services, offers, testimonials
  engagement: 10%  # Questions, polls, challenges

# Engagement Settings
engagement:
  auto_reply:
    enabled: true
    response_time_minutes: 15
    personalization: true

  dm_automation:
    enabled: true
    welcome_sequence: true
    lead_qualification: true

  comment_management:
    enabled: true
    sentiment_analysis: true
    priority_keywords: ["interested", "how much", "sign up", "more info", "dm me"]

# Analytics Tracking
analytics:
  metrics:
    - engagement_rate
    - reach
    - impressions
    - follower_growth
    - conversion_rate
    - best_posting_times
    - top_performing_content

  reporting:
    frequency: "weekly"
    dashboard: true
    alerts: true

# A/B Testing
ab_testing:
  enabled: true
  variables:
    - post_times
    - content_formats
    - caption_length
    - cta_placement
    - hashtag_count

  minimum_sample_size: 100
  confidence_level: 95%

# Growth Tactics
growth_tactics:
  collaboration:
    enabled: true
    target_accounts: "fitness_influencers, wellness_brands, nutrition_coaches"
    frequency: "weekly"

  contests:
    enabled: true
    frequency: "monthly"
    prize_ideas: ["free_training_session", "business_consultation", "course_access"]

  user_generated_content:
    enabled: true
    incentives: true
    showcase_frequency: "daily"

# Brand Voice
brand_voice:
  tone: "professional, motivating, authentic, direct"
  language: "conversational yet expert"
  emojis: "moderate use, professionally placed"
  personality_traits:
    - "empowering"
    - "results-focused"
    - "community-driven"
    - "innovation-minded"

# Carousel Template Configurations
carousel_templates:
  # Branding Specifications
  branding:
    background_color: "#F5E6D3"  # beige
    text_color_primary: "#8B7355"  # dark brown
    text_color_secondary: "#FFFFFF"  # white for contrast
    accent_color: "#D4A574"  # medium beige for borders/highlights

  # Educational/How-To Template
  templates:
    educational_howto:
      template_name: "educational_howto"
      min_slides: 4
      max_slides: 7
      slide_structure:
        slide_1: "cover"  # avatar + title
        slides_2_to_n-1: "content_steps"  # numbered steps with bullet points
        slide_n: "cta"  # call-to-action final slide
      content_format:
        title_max_chars: 60
        bullet_points_per_slide:
          min: 3
          max: 5
        bullet_max_chars: 80

  # Typography Settings
  typography:
    font_family: "Arial"
    font_sizes:
      cover_title: 48
      content_title: 42
      body_text: 32
      slide_number: 24
      cta_headline: 48
      cta_text: 40

  # Layout Dimensions
  layout:
    slide_width: 1080
    slide_height: 1080
    padding: 60
    avatar_size: 400
    icon_size: 200

# Content Templates for AI Generation
content_templates:
  carousel_topics:
    # Educational topics for personal trainers about admin automation
    admin_automation:
      - topic: "5 Time-Saving Admin Hacks Every PT Needs"
        description: "Cover scheduling, invoicing, client tracking, communication templates, and progress photo organization"
        target_slides: 6

      - topic: "How to Automate Your Client Onboarding Process"
        description: "Step-by-step guide covering welcome emails, intake forms, waivers, payment setup, and first session prep"
        target_slides: 7

      - topic: "Stop Chasing Payments: Automated Billing for PTs"
        description: "Setting up recurring payments, invoice reminders, late payment handling, and financial tracking"
        target_slides: 5

      - topic: "The 30-Minute Weekly Admin Routine That Replaced My 10-Hour Workweek"
        description: "Batch scheduling, template responses, automated check-ins, and systems for progress tracking"
        target_slides: 6

      - topic: "From Chaos to Calm: Organizing Your Training Business with Free Tools"
        description: "Using Google Suite, Calendly, and free CRM tools to streamline client management and communication"
        target_slides: 7

# Viral Hooks Configuration
viral_hooks:
  visual_hooks:
    description: "First-frame visual elements that stop scrolling"
    examples:
      - "Transformation result shown first"
      - "Unexpected prop or setup"
      - "Mid-action freeze frame"
      - "Before/after split screen"
      - "Text overlay with bold claim"

  text_hooks:
    description: "On-screen text overlays for sound-off viewing (1-7 words max)"
    templates:
      - "POV: [situation]"
      - "The [thing] nobody talks about"
      - "Stop if you [identifier]"
      - "This changed everything"
      - "Wait for it..."
      - "[Number] seconds to [benefit]"
      - "Why [common belief] is wrong"

  verbal_hooks:
    description: "Opening lines for first 3 seconds"
    templates:
      - "The message came at [time]..."
      - "Nobody told me [revelation]..."
      - "I lost [thing] because [reason]..."
      - "Stop doing [common mistake]..."
      - "What if I told you [contrarian claim]..."
      - "This one change [result]..."

# Video Formats Configuration
video_formats:
  quick_hit:
    duration_range: [15, 25]
    target_words: [25, 40]
    structure:
      - hook: 2
      - content: 12
      - cta: 3
    best_for:
      - "myth_busting"
      - "quick_tips"
      - "relatable_moments"
      - "challenges"

  standard:
    duration_range: [30, 45]
    target_words: [50, 75]
    structure:
      - hook: 3
      - setup: 8
      - content: 25
      - cta: 5
    best_for:
      - "tutorials"
      - "educational"
      - "behind_scenes"

  story:
    duration_range: [45, 60]
    target_words: [75, 100]
    structure:
      - hook: 3
      - story_setup: 10
      - tension: 20
      - resolution: 15
      - cta: 7
    best_for:
      - "transformations"
      - "client_stories"
      - "personal_journey"

# Viral Content Types Configuration
viral_content_types:
  relatable_struggle:
    percentage: 25
    description: "Universal trainer experiences that trigger 'that's me!' response"
    examples:
      - "The 5am alarm reality"
      - "Client excuse bingo"
      - "Equipment awkwardness"
      - "The meal prep struggle"
      - "When clients ghost you"
    visual_style: "POV format, internal monologue text"

  myth_buster:
    percentage: 20
    description: "Challenge common beliefs with proof"
    examples:
      - "Why [common advice] doesn't work"
      - "The truth about [topic]"
      - "What trainers get wrong about [subject]"
    visual_style: "Split screen, before/after, reaction"

  transformation_reveal:
    percentage: 15
    description: "Show result first, then explain"
    examples:
      - "Client result showcase"
      - "Business transformation"
      - "System upgrade reveal"
    visual_style: "Result first, then journey"

  challenge_content:
    percentage: 15
    description: "Interactive content that prompts participation"
    examples:
      - "Can you do this?"
      - "Trainer challenge"
      - "Rate your [skill]"
    visual_style: "Direct to camera, challenge format"

  behind_scenes:
    percentage: 15
    description: "Authentic glimpse into trainer life"
    examples:
      - "Day in the life"
      - "What actually happens"
      - "The reality of..."
    visual_style: "Raw, unpolished, real"

  quick_tip:
    percentage: 10
    description: "Single actionable insight"
    examples:
      - "One thing that changed everything"
      - "The shortcut for..."
      - "Do this instead of..."
    visual_style: "Direct, punchy, clear text overlay"

# Viral CTAs Configuration
viral_ctas:
  comment_triggers:
    - "Comment '[KEYWORD]' and I'll send you the template"
    - "Drop a [EMOJI] if this is you"
    - "Which one are you? Comment 1, 2, or 3"
    - "Tag a trainer who needs this"
    - "What's your number? Comment below"

  save_triggers:
    - "Save this before your next [SITUATION]"
    - "Bookmark this for [DAY/TIME]"
    - "You'll need this on [OCCASION]"

  share_triggers:
    - "Share this with a trainer who [SITUATION]"
    - "Send this to your [RELATIONSHIP]"
    - "Your gym buddy needs to see this"

  participation_triggers:
    - "Try this and show me your results"
    - "Duet this with your version"
    - "POV: Show me your [THING]"

# Content Themes Configuration
content_themes:
  gym_culture_humor:
    percentage: 15
    description: "Relatable gym moments and trainer humor"
    examples:
      - "That one client who..."
      - "Gym equipment struggles"
      - "Trainer vs client expectations"
      - "The internal monologue moments"

  myth_busting:
    percentage: 10
    description: "Challenge common fitness industry beliefs"
    examples:
      - "Why this popular advice is wrong"
      - "The truth about common practices"
      - "What the fitness industry gets wrong"
